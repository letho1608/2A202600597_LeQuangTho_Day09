<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Legal Multi-Agent Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e1a; color: #e2e8f0;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px; background: #0f172a; border-bottom: 1px solid #1e293b;
    flex-shrink: 0; height: 48px;
  }
  .top-bar h1 { font-size: 16px; color: #38bdf8; }
  .top-bar h1 span { color: #64748b; font-weight: 400; }
  .top-bar .right { display: flex; align-items: center; gap: 12px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .badge.online { background: #166534; color: #86efac; }
  .badge.offline { background: #7f1d1d; color: #fca5a5; }
  .mode-btn {
    padding: 4px 12px; border-radius: 6px; border: 1px solid #334155;
    background: transparent; color: #94a3b8; cursor: pointer; font-size: 11px;
    transition: all 0.2s;
  }
  .mode-btn.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .mode-btn:hover:not(.active) { border-color: #475569; }

  .main-area { display: flex; flex: 1; min-height: 0; }

  .network-panel {
    flex: 1; position: relative; overflow: hidden;
    border-right: 1px solid #1e293b;
  }
  .network-panel canvas { display: block; width: 100%; height: 100%; }
  .network-overlay {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #475569; pointer-events: none;
    text-align: center;
  }

  .chat-panel {
    width: 420px; display: flex; flex-direction: column;
    background: #0f172a; flex-shrink: 0;
  }
  .chat-header {
    padding: 10px 16px; border-bottom: 1px solid #1e293b;
    font-size: 13px; font-weight: 600; color: #94a3b8;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-header .stats { font-size: 11px; color: #475569; font-weight: 400; }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

  .message {
    padding: 10px 14px; border-radius: 10px; max-width: 90%;
    font-size: 13px; line-height: 1.6; animation: msgIn 0.25s ease;
  }
  .message ul, .message ol { margin: 4px 0; padding-left: 18px; }
  .message li { margin: 2px 0; }
  .message code {
    background: #0a0e1a; padding: 1px 5px; border-radius: 4px;
    font-size: 12px; color: #38bdf8;
  }
  .message strong { color: #fbbf24; }
  .message p { margin: 4px 0; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message.user {
    background: #1d4ed8; align-self: flex-end; border-bottom-right-radius: 3px;
  }
  .message.user code { background: #1e3a8a; color: #93c5fd; }
  .message.agent {
    background: #1e293b; align-self: flex-start; border-bottom-left-radius: 3px;
    border: 1px solid #334155;
  }
  .message.system {
    background: transparent; align-self: center; font-size: 11px;
    color: #64748b; text-align: center;
  }
  .placeholder {
    text-align: center; padding: 40px 20px; color: #475569; align-self: center;
  }
  .placeholder .big-icon { font-size: 36px; margin-bottom: 12px; }

  .chat-input-area {
    padding: 10px 16px; border-top: 1px solid #1e293b;
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .chat-input-area textarea {
    flex: 1; padding: 8px 12px; border-radius: 8px;
    background: #0a0e1a; border: 1px solid #334155; color: #e2e8f0;
    font-size: 13px; resize: none; outline: none; height: 38px;
  }
  .chat-input-area textarea:focus { border-color: #38bdf8; }
  .chat-input-area button {
    padding: 8px 16px; border-radius: 8px; border: none;
    background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer;
    transition: all 0.2s; font-size: 13px;
  }
  .chat-input-area button:hover { background: #7dd3fc; }
  .chat-input-area button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

  @media (max-width: 860px) {
    .chat-panel { width: 100%; }
    .main-area { flex-direction: column; }
    .network-panel { height: 200px; border-right: none; border-bottom: 1px solid #1e293b; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <h1>⚖️ Legal <span>Multi-Agent</span></h1>
    <div class="right">
      <button class="mode-btn active" data-mode="stage5" onclick="switchMode(this)">Stage 5 A2A</button>
      <button class="mode-btn" data-mode="stage4" onclick="switchMode(this)">Stage 4 Local</button>
      <span class="badge online" id="statusBadge">● Ready</span>
    </div>
  </div>

  <div class="main-area">
    <div class="network-panel" id="networkPanel">
      <canvas id="networkCanvas"></canvas>
      <div class="network-overlay" id="networkStatus">A2A Agent Network — idle</div>
    </div>
    <div class="chat-panel">
      <div class="chat-header">
        <span>💬 Chat</span>
        <span class="stats" id="statsInfo"></span>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="placeholder" id="placeholder">
          <div class="big-icon">⚖️</div>
          <p>Ask a legal question<br><small style="color:#334155;">e.g. contract breach + tax evasion</small></p>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="questionInput" rows="1" placeholder="Type your question..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask();}"></textarea>
        <button id="askBtn" onclick="ask()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── Markdown Renderer ──────────────────────────────
function renderMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/### (.+)/g, '<h4>$1</h4>')
    .replace(/## (.+)/g, '<h3>$1</h3>')
    .replace(/# (.+)/g, '<h2>$1</h2>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/^- (.+)/gm, '<li>$1</li>')
    .replace(/^\d+\. (.+)/gm, '<li>$1</li>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  if (html.startsWith('<li>')) html = '<ul>' + html.replace(/<li>/g, '<li>') + '</ul>';
  html = html.replace(/(<\/li>)(<li>)/g, '$1$2');
  if (html.includes('<li>') && !html.startsWith('<ul>') && !html.startsWith('<ol>')) {
    html = html.replace(/((?:<li>.*?<\/li>)+)/g, '<ul>$1</ul>');
  }
  html = html.replace(/<br><\/li>/g, '</li>');
  html = html.replace(/<\/ul><br>/g, '</ul>');
  html = `<p>${html}</p>`.replace(/<p><\/p>/g, '');
  return html;
}

// ─── A2A Network Canvas Animation ───────────────────
const canvas = document.getElementById('networkCanvas');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('networkPanel');
const statusEl = document.getElementById('networkStatus');

let W, H;
let agents = [];
let connections = [];
let particles = [];
let animActive = false;
let animTime = 0;

const AGENT_DEFS = [
  { id: 'registry',   label: 'Registry',   icon: '📋', row: 0, col: 1, color: '#f59e0b' },
  { id: 'customer',   label: 'Customer',   icon: '🏢', row: 1, col: 0, color: '#38bdf8' },
  { id: 'law',        label: 'Law',        icon: '⚖️', row: 1, col: 2, color: '#a78bfa' },
  { id: 'tax',        label: 'Tax',        icon: '💰', row: 2, col: 0, color: '#22c55e' },
  { id: 'compliance', label: 'Compliance', icon: '✅', row: 2, col: 2, color: '#f472b6' },
];

const EDGES = [
  { from: 'registry', to: 'customer' },
  { from: 'registry', to: 'law' },
  { from: 'customer', to: 'law' },
  { from: 'law',      to: 'tax' },
  { from: 'law',      to: 'compliance' },
];

function resize() {
  const rect = panel.getBoundingClientRect();
  canvas.width = Math.round(rect.width * devicePixelRatio);
  canvas.height = Math.round(rect.height * devicePixelRatio);
  W = rect.width; H = rect.height;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  layoutAgents();
}
window.addEventListener('resize', resize);

function layoutAgents() {
  const cols = 3, rows = 3;
  const cellW = W / cols, cellH = H / rows;
  const r = Math.min(cellW, cellH) * 0.28;
  const data = {};
  for (const def of AGENT_DEFS) {
    const cx = cellW * (def.col + 0.5);
    const cy = cellH * (def.row + 0.5);
    data[def.id] = { ...def, x: cx, y: cy, radius: r, pulse: 0, glow: 0, active: false };
  }
  agents = data;
  connections = EDGES.map(e => ({
    from: agents[e.from], to: agents[e.to],
    progress: 0, active: false, particles: [],
  }));
}

function spawnParticles(conn) {
  for (let i = 0; i < 5; i++) {
    particles.push({
      conn, progress: Math.random(),
      speed: 0.005 + Math.random() * 0.01,
      size: 2 + Math.random() * 3,
      alpha: 0.6 + Math.random() * 0.4,
    });
  }
}

let idlePulse = 0;
function idleLoop() {
  idlePulse += 0.005;
  for (const a of Object.values(agents)) {
    a.pulse = 0.15 + 0.1 * Math.sin(idlePulse + a.x * 0.01 + a.y * 0.01);
    a.glow = 0;
  }
}

function triggerNetworkAnim() {
  animActive = true; animTime = 0; particles = [];
  for (const a of Object.values(agents)) {
    a.active = false; a.pulse = 0; a.glow = 0;
  }
  // Registry first — agents register with it
  agents.registry.active = true;
  agents.registry.pulse = 1;
  agents.registry.glow = 0.8;
  agents.customer.active = true;
  agents.customer.pulse = 1;
  agents.customer.glow = 0.8;
  // Connect Registry->Customer
  const rc = connections.find(c => c.from.id === 'registry' && c.to.id === 'customer');
  if (rc) { rc.active = true; spawnParticles(rc); }
}

let cascadeTimers = [];
function clearCascade() {
  cascadeTimers.forEach(t => clearTimeout(t));
  cascadeTimers = [];
}

function startCascade() {
  clearCascade();
  // Step 1: Customer contacts law (0.8s)
  cascadeTimers.push(setTimeout(() => {
    agents.law.active = true;
    agents.law.pulse = 1; agents.law.glow = 0.8;
    statusEl.textContent = 'Law Agent analyzing...';
    const cl = connections.find(c => c.from.id === 'customer' && c.to.id === 'law');
    if (cl) { cl.active = true; spawnParticles(cl); }
    const rl = connections.find(c => c.from.id === 'registry' && c.to.id === 'law');
    if (rl) { rl.active = true; spawnParticles(rl); }
  }, 800));
  // Step 2: Law delegates to Tax (2s)
  cascadeTimers.push(setTimeout(() => {
    agents.tax.active = true;
    agents.tax.pulse = 1; agents.tax.glow = 0.8;
    statusEl.textContent = 'Tax Agent processing...';
    const lt = connections.find(c => c.from.id === 'law' && c.to.id === 'tax');
    if (lt) { lt.active = true; spawnParticles(lt); }
  }, 2000));
  // Step 3: Law delegates to Compliance (2s)
  cascadeTimers.push(setTimeout(() => {
    agents.compliance.active = true;
    agents.compliance.pulse = 1; agents.compliance.glow = 0.8;
    statusEl.textContent = 'Compliance Agent processing...';
    const lc = connections.find(c => c.from.id === 'law' && c.to.id === 'compliance');
    if (lc) { lc.active = true; spawnParticles(lc); }
  }, 2000));
  // Step 4: Done (4s)
  cascadeTimers.push(setTimeout(() => {
    animActive = false;
    statusEl.textContent = 'A2A Agent Network — idle';
    clearCascade();
  }, 4000));
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#1e293b';
  const spacing = 30;
  for (let x = 0; x < W; x += spacing) {
    for (let y = 0; y < H; y += spacing) {
      ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
    }
  }

  for (const c of connections) {
    const { from, to } = c;
    const dx = to.x - from.x, dy = to.y - from.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    const nx = dx / len, ny = dy / len;
    if (c.active) {
      const grad = ctx.createLinearGradient(from.x, from.y, to.x, to.y);
      grad.addColorStop(0, from.color + '80');
      grad.addColorStop(0.5, '#38bdf880');
      grad.addColorStop(1, to.color + '80');
      ctx.strokeStyle = grad; ctx.lineWidth = 3;
      ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
    } else {
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
    }
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.shadowBlur = 0;
    const midX = (from.x + to.x) / 2, midY = (from.y + to.y) / 2;
    const arrowAng = Math.atan2(dy, dx);
    ctx.fillStyle = c.active ? '#38bdf8' : '#1e293b';
    ctx.beginPath();
    ctx.moveTo(midX + nx * 6, midY + ny * 6);
    ctx.lineTo(midX + nx * 6 - 10 * Math.cos(arrowAng - 0.5), midY + ny * 6 - 10 * Math.sin(arrowAng - 0.5));
    ctx.lineTo(midX + nx * 6 - 10 * Math.cos(arrowAng + 0.5), midY + ny * 6 - 10 * Math.sin(arrowAng + 0.5));
    ctx.closePath(); ctx.fill();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.progress += p.speed;
    if (p.progress > 1) { particles.splice(i, 1); continue; }
    const x = p.conn.from.x + (p.conn.to.x - p.conn.from.x) * p.progress;
    const y = p.conn.from.y + (p.conn.to.y - p.conn.from.y) * p.progress;
    const alpha = p.alpha * (1 - Math.abs(p.progress - 0.5) * 2);
    ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`;
    ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 15;
    ctx.fill(); ctx.shadowBlur = 0;
  }

  for (const a of Object.values(agents)) {
    const r = a.radius * (1 + a.pulse * 0.08);
    if (a.active) {
      const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, r * 2.5);
      grad.addColorStop(0, a.color + '40');
      grad.addColorStop(1, a.color + '00');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(a.x, a.y, r * 2.5, 0, Math.PI * 2); ctx.fill();
    }
    const grad2 = ctx.createRadialGradient(a.x - r*0.3, a.y - r*0.3, 0, a.x, a.y, r);
    grad2.addColorStop(0, '#1e293b');
    grad2.addColorStop(0.7, '#0f172a');
    ctx.fillStyle = grad2;
    ctx.strokeStyle = a.active ? a.color : '#334155';
    ctx.lineWidth = a.active ? 2.5 : 1.5;
    ctx.shadowColor = a.active ? a.color : 'transparent';
    ctx.shadowBlur = a.active ? 20 : 0;
    ctx.beginPath(); ctx.arc(a.x, a.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = `${r * 0.65}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = a.active ? a.color : '#64748b';
    ctx.fillText(a.icon, a.x, a.y - 2);
    ctx.font = `bold ${Math.max(9, r * 0.28)}px sans-serif`;
    ctx.fillStyle = a.active ? '#e2e8f0' : '#64748b';
    ctx.fillText(a.label, a.x, a.y + r + 14);
    if (a.pulse > 0.05) {
      ctx.strokeStyle = a.color + Math.round(a.pulse * 60).toString(16).padStart(2, '0');
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(a.x, a.y, r * (1 + a.pulse * 0.6), 0, Math.PI * 2); ctx.stroke();
    }
  }
}

function animate() {
  if (animActive) {
    animTime += 0.016;
    for (const a of Object.values(agents)) {
      if (a.pulse > 0) a.pulse = Math.max(0, a.pulse - 0.008);
      if (a.glow > 0) a.glow = Math.max(0, a.glow - 0.008);
    }
  } else { idleLoop(); }
  draw();
  requestAnimationFrame(animate);
}

// ─── Chat & API ─────────────────────────────────────
let currentMode = 'stage5';
let isRunning = false;

function switchMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
}

function addMessage(role, content) {
  const container = document.getElementById('chatMessages');
  const placeholder = document.getElementById('placeholder');
  if (placeholder) placeholder.remove();
  const div = document.createElement('div');
  div.className = `message ${role}`;
  if (role === 'agent') {
    div.innerHTML = renderMarkdown(content);
  } else {
    div.textContent = content;
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function ask() {
  if (isRunning) return;
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) return;

  isRunning = true;
  const btn = document.getElementById('askBtn');
  btn.disabled = true; btn.textContent = '...';
  document.getElementById('statusBadge').textContent = '● Processing';
  document.getElementById('statusBadge').className = 'badge offline';
  document.getElementById('statsInfo').textContent = '';

  addMessage('user', question);
  input.value = '';
  statusEl.textContent = 'A2A Agent Network — processing...';

  triggerNetworkAnim();
  startCascade();

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, mode: currentMode }),
    });
    const data = await resp.json();

    if (data.error) {
      addMessage('system', `Error: ${data.error}`);
    } else {
      addMessage('agent', data.answer);
      document.getElementById('statsInfo').textContent =
        `${data.total_time}s · ${data.steps ? data.steps.length : 0} steps`;
    }
  } catch (err) {
    addMessage('system', `Connection error: ${err.message}`);
  }

  btn.disabled = false; btn.textContent = 'Send';
  document.getElementById('statusBadge').textContent = '● Ready';
  document.getElementById('statusBadge').className = 'badge online';
  isRunning = false;
}

// ─── Init ───────────────────────────────────────────
resize();
idleLoop();
animate();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 100);
});
</script>
</body>
</html>
